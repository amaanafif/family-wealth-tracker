services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wealth
      POSTGRES_USER: wealth
      POSTGRES_PASSWORD: wealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/wealth
      DATABASE_USERNAME: wealth
      DATABASE_PASSWORD: wealth
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
